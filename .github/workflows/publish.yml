# Publish to PyPI (trusted publishing) and the official MCP Registry.
# Manual for now (Actions -> Publish -> Run workflow) until the PyPI trusted publisher is set up.
# To publish automatically on each release, add:  release: { types: [published] }
name: Publish
on:
  workflow_dispatch:
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1
  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - name: Wait for PyPI to serve the new version
        run: sleep 60
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
