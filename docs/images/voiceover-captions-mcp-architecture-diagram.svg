<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">Voiceover &amp; captions MCP server architecture</title>
  <desc id="d">An AI agent (Claude Desktop, Claude Code, Cursor, OpenAI Codex, VS Code, Windsurf) calls the miragea-voice-mcp server over MCP stdio. The server validates input, adds idempotency keys, and calls the Miragea voice engine for text-to-speech, voice cloning and speech recognition, then writes an MP3 voiceover plus SRT and WebVTT captions for CapCut, Premiere Pro, DaVinci Resolve and YouTube.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef2ff"/><stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#0f172a}
    .h{font-size:20px;font-weight:700}
    .s{font-size:14px;fill:#334155}
    .m{font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#1e293b}
    .l{font-size:13px;fill:#475569;font-style:italic}
    .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:2;rx:14}
    .core{fill:url(#g);stroke:#6366f1;stroke-width:2.5;rx:14}
    .eng{fill:#fff7ed;stroke:#f59e0b;stroke-width:2;rx:14}
    .out{fill:#ecfdf5;stroke:#10b981;stroke-width:2;rx:14}
    .ln{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#a)}
  </style>
  <rect width="1200" height="520" fill="#f8fafc"/>
  <text x="600" y="42" text-anchor="middle" class="h" style="font-size:24px">Script → voiceover + captions in one MCP tool call</text>

  <!-- agent -->
  <rect x="30" y="90" width="250" height="250" rx="14" class="box"/>
  <text x="155" y="125" text-anchor="middle" class="h">AI agent</text>
  <text x="155" y="160" text-anchor="middle" class="s">Claude Desktop</text>
  <text x="155" y="184" text-anchor="middle" class="s">Claude Code</text>
  <text x="155" y="208" text-anchor="middle" class="s">Cursor</text>
  <text x="155" y="232" text-anchor="middle" class="s">OpenAI Codex</text>
  <text x="155" y="256" text-anchor="middle" class="s">VS Code · Windsurf</text>
  <text x="155" y="300" text-anchor="middle" class="l">"Turn script.txt into a calm</text>
  <text x="155" y="318" text-anchor="middle" class="l">voiceover with captions"</text>

  <path d="M280 215 L360 215" class="ln"/>
  <text x="320" y="203" text-anchor="middle" class="m">MCP</text>
  <text x="320" y="236" text-anchor="middle" class="m">stdio</text>

  <!-- server -->
  <rect x="365" y="70" width="400" height="290" rx="14" class="core"/>
  <text x="565" y="105" text-anchor="middle" class="h">miragea-voice-mcp server</text>
  <text x="565" y="128" text-anchor="middle" class="s">open source · MIT · Python</text>
  <text x="390" y="165" class="m">miragea_script_to_voiceover</text>
  <text x="390" y="187" class="m">miragea_text_to_speech</text>
  <text x="390" y="209" class="m">miragea_transcribe</text>
  <text x="390" y="231" class="m">miragea_get_capabilities · list_voices</text>
  <text x="390" y="253" class="m">miragea_get_task · list_tasks</text>
  <text x="390" y="290" class="s">✔ validates input against live capabilities</text>
  <text x="390" y="312" class="s">✔ idempotency keys: no duplicate jobs on retry</text>
  <text x="390" y="334" class="s">✔ captions keep your exact script spelling</text>

  <path d="M765 160 L845 160" class="ln"/>
  <path d="M845 255 L765 255" class="ln"/>
  <text x="805" y="148" text-anchor="middle" class="m">HTTPS</text>

  <!-- engine -->
  <rect x="850" y="90" width="320" height="200" rx="14" class="eng"/>
  <text x="1010" y="125" text-anchor="middle" class="h">Voice engine: Miragea</text>
  <text x="1010" y="160" text-anchor="middle" class="s">Text-to-speech (expressive / standard)</text>
  <text x="1010" y="186" text-anchor="middle" class="s">Voice cloning from a reference URL</text>
  <text x="1010" y="212" text-anchor="middle" class="s">Emotion &amp; style tags · speed 0.25–4×</text>
  <text x="1010" y="238" text-anchor="middle" class="s">Speech recognition with timestamps</text>
  <text x="1010" y="266" text-anchor="middle" class="m">MIRAGEA_API_KEY</text>

  <path d="M565 360 L565 405" class="ln"/>

  <!-- outputs -->
  <rect x="215" y="410" width="700" height="90" rx="14" class="out"/>
  <text x="565" y="443" text-anchor="middle" class="h">~/Miragea/my-short.mp3 · my-short.srt · my-short.vtt</text>
  <text x="565" y="475" text-anchor="middle" class="s">Import into CapCut, Premiere Pro, DaVinci Resolve, YouTube, TikTok, Reels and Shorts</text>
</svg>
