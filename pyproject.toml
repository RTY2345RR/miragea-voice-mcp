[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tts-mcp-server"
version = "0.1.1"
description = "TTS MCP server: text-to-speech, AI voiceover, voice cloning and SRT/VTT subtitles for Claude, Cursor, Codex and other AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Miragea" }]
keywords = [
  "tts-mcp-server", "tts-mcp", "text-to-speech-mcp", "mcp", "mcp-server", "model-context-protocol", "text-to-speech", "tts", "ai-voiceover", "elevenlabs-alternative", "voiceover",
  "voice-cloning", "subtitles", "srt", "vtt", "captions", "speech-to-text", "transcription",
  "ai-voice", "claude", "cursor", "codex", "video-creator", "youtube-shorts", "miragea",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Multimedia :: Sound/Audio :: Conversion",
  "Topic :: Multimedia :: Video",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp>=1.9,<3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4", "build", "twine"]

[project.urls]
Homepage = "https://github.com/RTY2345RR/miragea-voice-mcp"
Demo = "https://huggingface.co/spaces/miragea/miragea-voice-mcp"
"Voice engine" = "https://miragea.ai"
PyPI = "https://pypi.org/project/tts-mcp-server/"
Docker = "https://hub.docker.com/r/miragea/tts-mcp-server"
Repository = "https://github.com/RTY2345RR/miragea-voice-mcp"
Documentation = "https://github.com/RTY2345RR/miragea-voice-mcp#readme"
Issues = "https://github.com/RTY2345RR/miragea-voice-mcp/issues"
Changelog = "https://github.com/RTY2345RR/miragea-voice-mcp/blob/main/CHANGELOG.md"
"API keys" = "https://miragea.ai/workspace/api"

[project.scripts]
tts-mcp-server = "miragea_voice_mcp.cli:main"
miragea-voice-mcp = "miragea_voice_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/miragea_voice_mcp"]

[tool.hatch.build.targets.sdist]
include = [
  "src/", "tests/", "skills/", "examples/", "docs/", "README.md", "LICENSE", "CHANGELOG.md", "llms.txt",
  "server.json", "smithery.yaml", "glama.json", "Dockerfile", "pyproject.toml", "PUBLISHING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
